<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Villa Aurora 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --panel:rgba(18,20,26,.78); --line:rgba(255,255,255,.12);
    --text:#f4efe6; --muted:#b9b2a6; --gold:#d4b06a; --gold2:#f1d79a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

  /* top bar */
  #top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;
    align-items:center;gap:10px;justify-content:space-between;pointer-events:none;z-index:5}
  #brand{pointer-events:auto;padding:8px 14px;display:flex;flex-direction:column;line-height:1.05}
  #brand b{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.06em;color:var(--gold2);font-weight:600}
  #brand span{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  #modes{pointer-events:auto;display:flex;padding:4px;gap:4px}
  #modes button{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:500;color:var(--muted)}
  #modes button.on{background:linear-gradient(135deg,var(--gold),#a9843f);color:#1a140a}

  /* side tools */
  #tools{position:fixed;right:12px;top:calc(78px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;z-index:5}
  .tbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:20px;position:relative}
  .tbtn.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .tbtn small{position:absolute;right:54px;white-space:nowrap;font-size:12px;background:var(--panel);padding:4px 8px;
    border-radius:8px;opacity:0;transition:.2s;pointer-events:none;border:1px solid var(--line)}
  @media (hover:hover){.tbtn:hover small{opacity:1}}

  /* rooms panel */
  #roomsBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:6;padding:12px 22px;border-radius:999px;border:1px solid var(--gold);background:var(--panel);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;font-size:15px;color:var(--gold2)}
  #rooms{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    width:min(560px,calc(100% - 24px));max-height:min(62vh,520px);overflow:auto;padding:14px;z-index:7;
    opacity:0;pointer-events:none;transition:.25s}
  #rooms.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #rooms h3{margin:4px 6px 10px;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold2);font-weight:600}
  #rooms .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 6px 6px}
  #rooms .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  #rooms .grid button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px}
  #rooms .grid button:active,#rooms .grid button:hover{border-color:var(--gold);background:rgba(212,176,106,.12)}
  #rooms .grid button i{font-style:normal;font-size:20px}

  /* walk HUD */
  #roomName{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translateX(-50%);z-index:4;
    padding:7px 16px;border-radius:999px;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold2);
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  body.walk #roomName{opacity:1}
  #joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:128px;height:128px;
    border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(15,17,21,.35);z-index:6;display:none;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 60%,#8a6a2f);box-shadow:0 4px 14px rgba(0,0,0,.4)}
  body.walk.touch #joy{display:block}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;
    font-size:12.5px;color:var(--muted);padding:7px 12px;border-radius:10px;opacity:0;transition:.4s;pointer-events:none;text-align:center;max-width:calc(100% - 24px)}
  #hint.show{opacity:1}
  body.walk.touch #hint{bottom:calc(166px + env(safe-area-inset-bottom))}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.7);
    z-index:3;display:none;pointer-events:none}
  body.walk #cross{display:block}

  /* loader */
  #loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1c1f27,#0b0c10);transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .in{text-align:center}
  #loader b{display:block;font-family:'Cormorant Garamond',serif;font-size:40px;letter-spacing:.12em;color:var(--gold2);font-weight:600}
  #loader span{font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  #loader .bar{width:180px;height:2px;background:rgba(255,255,255,.1);margin:22px auto 0;overflow:hidden;border-radius:2px}
  #loader .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:ld 1.1s infinite ease-in-out}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

  @media (max-width:560px){
    #brand b{font-size:18px} #brand span{font-size:9px}
    #modes button{padding:8px 10px;font-size:13px}
    #tools{top:auto;bottom:calc(80px + env(safe-area-inset-bottom))}
    body.walk.touch #tools{bottom:calc(80px + env(safe-area-inset-bottom))}
    #roomName{font-size:17px}
    #rooms .grid{grid-template-columns:1fr 1fr}
  }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/" } }
</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="top">
  <div id="brand" class="glass"><b>VILLA AURORA</b><span>Beverly Hills · 3D</span></div>
  <div id="modes" class="glass">
    <button id="mOrbit" class="on">Обзор</button>
    <button id="mWalk">Прогулка</button>
  </div>
</div>

<div id="tools">
  <button class="tbtn on" id="tRoof">🏠<small>Крыша</small></button>
  <button class="tbtn on" id="tFloor2">②<small>2-й этаж</small></button>
  <button class="tbtn" id="tNight">🌙<small>День / Ночь</small></button>
</div>

<div id="roomName" class="glass">Холл</div>
<div id="cross"></div>
<div id="hint" class="glass"></div>
<div id="joy"><div id="knob"></div></div>

<button id="roomsBtn">Комнаты ▴</button>
<div id="rooms" class="glass">
  <h3>Куда пойдём?</h3>
  <div class="grp">1-й этаж</div>
  <div class="grid" data-level="0"></div>
  <div class="grp">2-й этаж</div>
  <div class="grid" data-level="1"></div>
  <div class="grp">Снаружи</div>
  <div class="grid" data-level="out"></div>
</div>

<div id="loader"><div class="in"><b>VILLA AURORA</b><span>строим особняк…</span><div class="bar"><i></i></div></div></div>

<script type="module" src="./js/house.js"></script>
</body>
</html>
