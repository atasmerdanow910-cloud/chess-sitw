name: bazar_tm
description: "Bazar TM: marketplace for traders of Turkmenistan"
publish_to: 'none'

# version: <user-visible name>+<build number for the Play Store / APK updates>
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Since Flutter 3.4x the Material and Cupertino widgets live in these packages.
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the ARB files (see l10n.yaml).
  generate: true
