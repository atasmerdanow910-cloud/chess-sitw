# Bazar TM: checks the server and the app on GitHub's machines and builds the Android APK.
# A test APK is published as the pre-release "bazar-tm-test" (direct download link, no login):
#   https://github.com/<owner>/<repo>/releases/download/bazar-tm-test/bazar-tm.apk
name: Bazar TM

on:
  push:
    branches: [ccr-d10ab0ac-yrj6qu]
    paths: ['bazar-tm/**', '.github/workflows/bazar-tm.yml']
  pull_request:
    paths: ['bazar-tm/**', '.github/workflows/bazar-tm.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazar-tm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bazar-tm/server
    # Real PostgreSQL and Redis for the tests. They live only inside this job, so no password is needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bazar-tm/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Docker image builds
        run: docker build --quiet -t bazar-tm-server:ci .
      - name: Dependency audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: bazar-tm/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # Test builds are signed with a debug key. Keeping the same key between runs lets a newer
      # test APK install over an older one. The real release key arrives on Day 9 (GitHub secret).
      - name: Reuse the test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bazar-tm-debug-keystore-v1

      - run: flutter pub get
      - name: Code format
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -path 'lib/l10n/*')
      - run: flutter analyze
      - run: flutter test

      # The run number is the version code, so every new test build installs as an update.
      # Both APKs get the same version code, so a phone can switch between them.
      - name: Build APK (obfuscated release)
        run: |
          flutter build apk --release --build-number=$GITHUB_RUN_NUMBER \
            --obfuscate --split-debug-info=build/symbols/universal
          flutter build apk --release --build-number=$GITHUB_RUN_NUMBER \
            --split-per-abi --target-platform android-arm64 -P force-version-code-ignoring-abi=true \
            --obfuscate --split-debug-info=build/symbols/arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/bazar-tm.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/bazar-tm-arm64.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: bazar-tm-apk
          path: bazar-tm/app/dist/*.apk

      # Needed to read crash reports of the obfuscated build. Not secret, but not published either.
      - uses: actions/upload-artifact@v4
        with:
          name: bazar-tm-debug-symbols
          path: bazar-tm/app/build/symbols

  publish:
    name: Publish test APK
    needs: [server, app]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bazar-tm-apk
          path: dist
      - name: Replace the "bazar-tm-test" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=bazar-tm-test
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/bazar-tm.apk dist/bazar-tm-arm64.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Bazar TM — тестовая сборка №${{ github.run_number }}" \
            --notes "Тестовая сборка на демо-данных (без сервера). bazar-tm.apk — для любого Android-телефона. bazar-tm-arm64.apk — та же программа, файл меньше, подходит большинству телефонов после 2017 года."
