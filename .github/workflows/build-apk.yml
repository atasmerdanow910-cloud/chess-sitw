name: Build APK

on:
  push:
    paths:
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/strelka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: strelka-apk
          path: dist/strelka.apk
          if-no-files-found: error

      - name: Publish the APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "strelka-build-${{ github.run_number }}" dist/strelka.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Strelka — build ${{ github.run_number }}" \
            --notes "Android APK for Strelka. Download strelka.apk on your phone and install it."
