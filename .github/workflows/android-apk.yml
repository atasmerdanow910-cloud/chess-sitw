# Сборка приложения SystemMarket для Android на серверах GitHub.
# Готовый APK кладётся в marketplace/static/systemmarket.apk — установщик сайта
# выкладывает его по адресу https://sstymmarket.click/systemmarket.apk
name: Android APK

on:
  push:
    branches: [ccr-d10ab0ac-yrj6qu]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build SystemMarket.apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: bash android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SystemMarket-apk
          path: android/build/SystemMarket.apk

      - name: Put the APK next to the site files
        run: |
          cp android/build/SystemMarket.apk marketplace/static/systemmarket.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace/static/systemmarket.apk
          git commit -m "Android: SystemMarket.apk (build ${{ github.run_number }})" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
