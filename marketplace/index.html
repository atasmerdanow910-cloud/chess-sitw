<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<meta name="description" content="SystemMarket — объявления: авто, недвижимость, телефоны, электроника и другое.">
<title>SystemMarket — объявления</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315803d'/%3E%3Cpath d='M21 11.5c-.8-1.6-2.6-2.5-4.9-2.5-3 0-5 1.5-5 3.7 0 2 1.4 3 4.6 3.6 2.4.5 3.3 1 3.3 2s-1.1 1.8-3 1.8c-1.9 0-3.3-.8-4-2.2' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#eceef1; --text:#111418; --muted:#687080;
  --border:#e1e4e8; --accent:#15803d; --accent-hover:#166534; --accent-ink:#ffffff; --accent-soft:#e7f5ec;
  --danger:#c62828; --star:#e11d48; --skeleton:#e6e8ec;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f12; --surface:#16191e; --surface-2:#1f232a; --text:#eceef1; --muted:#98a0ad;
    --border:#272c34; --accent:#22a355; --accent-hover:#2bb862; --accent-ink:#ffffff; --accent-soft:#132a1c;
    --danger:#ef5350; --star:#fb7185; --skeleton:#1f232a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .wrap{display:flex;gap:12px;align-items:center;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:900}
.logo .txt span{color:var(--accent)}
@media (max-width:420px){.logo .txt{display:none}}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:0 12px;min-width:0;height:40px;border:1px solid transparent}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:100%}
.search .i{color:var(--muted)}
.page-title{font-size:19px;font-weight:800;margin:0;flex:1}

/* categories */
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none;max-width:1120px;margin:0 auto}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
  border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.chip .i{width:18px;height:18px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .i{color:var(--accent-ink)}
.filters{display:flex;gap:8px;padding:10px 0 0}
.filters select{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;height:40px}
.count{color:var(--muted);font-size:13px;margin:10px 0}

/* grid / cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;background:var(--surface-2);display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.nophoto .i{width:34px;height:34px;stroke-width:1.5}
.badge{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px}
.badge .i{width:14px;height:14px}
.heart{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);
  display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18);color:#1f2937}
.heart .i{width:18px;height:18px}
.heart.on .i,.icon-btn.on .i{fill:var(--star);stroke:var(--star)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.price{font-weight:800;font-size:17px;letter-spacing:-.01em}
.title{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--muted);font-size:12px;margin-top:auto;padding-top:4px}

/* skeleton */
.sk{background:var(--skeleton);border-radius:8px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
@media (prefers-color-scheme: dark){.sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}}

.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px}
.empty .ic .i{width:30px;height:30px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.75;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.block{width:100%}
.btn .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.22);width:0;transition:width .2s}
.more{display:flex;justify-content:center;margin:18px 0}

/* bottom nav */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bottombar .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:60px;padding:0 4px}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;line-height:1.1;color:var(--muted);font-weight:600;white-space:nowrap}
.nav .i{width:23px;height:23px}
.nav.on{color:var(--accent)}
.nav.add .plus{width:46px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.nav.add .plus .i{width:22px;height:22px;stroke-width:2.4}
.nav.add{color:var(--text)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;overscroll-behavior:contain}
.sheet.open{display:block}
@media (min-width:760px){
  .sheet{background:rgba(0,0,0,.5);padding:32px 16px}
  .sheet .panel{max-width:720px;margin:0 auto;border-radius:18px;overflow:hidden;min-height:0}
}
.panel{background:var(--bg);min-height:100%}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.sheet-head h2{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}

.gallery{position:relative;background:#000}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track img{flex:none;width:100%;aspect-ratio:4/3;object-fit:contain;scroll-snap-align:center;background:#000;cursor:zoom-in}
.gallery .counter{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:3px 9px;border-radius:8px}
.gallery .nophoto{position:static;aspect-ratio:16/9;background:var(--surface-2)}
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:6px;opacity:.6;cursor:pointer;flex:none;border:2px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--accent)}
.detail{padding:16px;display:flex;flex-direction:column;gap:14px}
.detail .price{font-size:26px}
.detail h1{font-size:19px;margin:2px 0 0;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--muted)}
.tag .i{width:15px;height:15px}
.box{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.box h3{margin:0 0 10px;font-size:15px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.specs dt{color:var(--muted);font-size:12px}
.specs dd{margin:0;font-weight:600}
.desc{white-space:pre-wrap;margin:0;word-break:break-word}
.seller{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.seller .who{flex:1;min-width:0}
.seller .who b{display:block}
.row{display:flex;gap:10px}
.row > *{flex:1}
.foot{color:var(--muted);font-size:12px;text-align:center}

.viewer{position:fixed;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .icon-btn{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.15);color:#fff}

/* form */
form{padding:16px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lbl{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:12px;font-weight:400}
.field input,.field select,.field textarea{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 12px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:380px){.catpick{grid-template-columns:repeat(3,1fr)}}
.catpick button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center}
.catpick button .i{width:24px;height:24px;color:var(--muted)}
.catpick button.on{border-color:var(--accent);background:var(--accent-soft)}
.catpick button.on .i{color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:520px){.photos{grid-template-columns:repeat(4,1fr)}}
.slot{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.slot .x .i{width:14px;height:14px;stroke-width:2.4}
.slot .main{position:absolute;left:4px;bottom:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px}
.addph{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;text-align:center;padding:4px}
.addph .i{width:28px;height:28px}
.err{color:var(--danger);font-size:13px;display:none}
.err.show{display:block}
.section{display:none;flex-direction:column;gap:14px}
.section.show{display:flex}
details.adm summary{cursor:pointer;color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);opacity:0;
  background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;transition:.2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topbar"><div class="wrap" id="topbar"></div></header>
<nav class="cats" id="cats" aria-label="Категории"></nav>
<main class="wrap">
  <div id="filters"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<nav class="bottombar" aria-label="Меню">
  <div class="wrap">
    <a class="nav" href="#/" data-nav="home"><svg class="i"><use href="#i-home"/></svg>Главная</a>
    <a class="nav" href="#/fav" data-nav="fav"><svg class="i"><use href="#i-heart"/></svg>Избранное</a>
    <a class="nav add" href="#/add" data-nav="add"><span class="plus"><svg class="i"><use href="#i-plus"/></svg></span>Подать</a>
    <a class="nav" href="#/my" data-nav="my"><svg class="i"><use href="#i-list"/></svg>Мои</a>
    <a class="nav" href="#/profile" data-nav="profile"><svg class="i"><use href="#i-user"/></svg>Профиль</a>
  </div>
</nav>

<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-label="Объявление">
  <div class="panel">
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="Назад"><svg class="i"><use href="#i-back"/></svg></button>
      <h2 id="detailHeadTitle">Объявление</h2>
      <button class="icon-btn" id="shareBtn" aria-label="Поделиться"><svg class="i"><use href="#i-share"/></svg></button>
      <button class="icon-btn" id="detailFav" aria-label="В избранное"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<div class="sheet" id="formSheet" role="dialog" aria-modal="true" aria-label="Новое объявление">
  <div class="panel">
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button>
      <h2>Новое объявление</h2>
    </div>
    <form id="addForm" novalidate>
      <div class="field">
        <span class="lbl">Категория</span>
        <div class="catpick" id="catPick"></div>
        <div class="err" id="errCat">Выберите категорию</div>
      </div>

      <div class="field">
        <span class="lbl">Фотографии <small>до 6 штук, первое будет главным</small></span>
        <div class="photos" id="photoGrid"></div>
        <input class="sr" type="file" id="photoInput" accept="image/*" multiple>
      </div>

      <div class="field">
        <label for="fTitle">Заголовок</label>
        <input id="fTitle" name="title" maxlength="80" placeholder="Например: Toyota Camry 2018" autocomplete="off">
        <div class="err" id="errTitle">Напишите заголовок (минимум 3 символа)</div>
      </div>

      <div class="section" id="autoFields">
        <div class="grid2">
          <div class="field"><label for="fBrand">Марка</label><select id="fBrand" name="brand"></select></div>
          <div class="field"><label for="fModel">Модель</label><input id="fModel" name="model" maxlength="40" placeholder="Camry"></div>
          <div class="field"><label for="fYear">Год выпуска</label><input id="fYear" name="year" type="number" inputmode="numeric" min="1950" max="2035" placeholder="2018"></div>
          <div class="field"><label for="fMileage">Пробег, км</label><input id="fMileage" name="mileage" type="number" inputmode="numeric" min="0" placeholder="120000"></div>
          <div class="field"><label for="fGear">Коробка</label><select id="fGear" name="gear"><option>Автомат</option><option>Механика</option><option>Вариатор</option><option>Робот</option></select></div>
          <div class="field"><label for="fFuel">Топливо</label><select id="fFuel" name="fuel"><option>Бензин</option><option>Газ</option><option>Бензин + газ</option><option>Дизель</option><option>Гибрид</option><option>Электро</option></select></div>
        </div>
      </div>

      <div class="section" id="realtyFields">
        <div class="grid2">
          <div class="field"><label for="fDeal">Тип сделки</label><select id="fDeal" name="deal"><option>Продажа</option><option>Аренда</option></select></div>
          <div class="field"><label for="fRooms">Комнат</label><input id="fRooms" name="rooms" type="number" inputmode="numeric" min="0" placeholder="3"></div>
          <div class="field"><label for="fArea">Площадь, м²</label><input id="fArea" name="area" type="number" inputmode="numeric" min="0" placeholder="85"></div>
          <div class="field"><label for="fFloor">Этаж</label><input id="fFloor" name="floor" type="number" inputmode="numeric" placeholder="5"></div>
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="fPrice">Цена, TMT</label>
          <input id="fPrice" name="price" type="number" inputmode="numeric" min="0" placeholder="0 — договорная">
          <div class="err" id="errPrice">Укажите цену</div>
        </div>
        <div class="field">
          <label for="fCity">Город</label>
          <select id="fCity" name="city"></select>
        </div>
      </div>

      <div class="field">
        <label for="fDesc">Описание</label>
        <textarea id="fDesc" name="desc" maxlength="3000" placeholder="Состояние, комплектация, причина продажи…"></textarea>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="fName">Имя</label>
          <input id="fName" name="name" maxlength="30" placeholder="Как к вам обращаться" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="fPhone">Телефон</label>
          <input id="fPhone" name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="+993 6X XXXXXX" autocomplete="tel">
          <div class="err" id="errPhone">Укажите номер телефона</div>
        </div>
      </div>

      <button class="btn block" type="submit" id="submitBtn"><span class="bar" id="upBar"></span><span id="submitTxt">Опубликовать</span></button>
      <div class="foot">Публикуя объявление, вы подтверждаете, что информация в нём достоверна.</div>
    </form>
  </div>
</div>

<div class="viewer" id="viewer"><img alt="" id="viewerImg"><button class="icon-btn" id="viewerClose" aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button></div>
<div class="toast" id="toast" role="status"></div>

<!-- Иконки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 4.5 6.6 4.5c2 0 3.4 1.1 4.4 2.6 1-1.5 2.4-2.6 4.4-2.6 3.6 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>

  <symbol id="c-services" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.7 1.7 0 0 0 2.4 2.4l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.4 2.4-2.3-.5-.5-2.3z"/></symbol>
  <symbol id="c-other" viewBox="0 0 24 24"><path d="m3 7.5 9-4.5 9 4.5v9L12 21l-9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></symbol>
</svg>

<script>
(function(){
"use strict";

/* ============ Справочники ============ */
const CATS = [
  {id:'all', name:'Все'}, {id:'auto', name:'Авто'}, {id:'realty', name:'Недвижимость'},
  {id:'phones', name:'Телефоны'}, {id:'electronics', name:'Электроника'}, {id:'home', name:'Дом и сад'},
  {id:'clothes', name:'Одежда'}, {id:'services', name:'Услуги'}, {id:'other', name:'Разное'}
];
const CITIES = ['Ашхабад','Аркадаг','Балканабат','Дашогуз','Мары','Туркменабат','Туркменбаши','Теджен','Байрамали','Другой'];
const BRANDS = ['Toyota','Lexus','Hyundai','Kia','Chevrolet','Mercedes-Benz','BMW','Nissan','Honda','Ford','Mitsubishi','Volkswagen','Lada','Другая'];
const MAX_PHOTOS = 6, PAGE = 24;

/* ============ Утилиты ============ */
const $ = (s, r = document) => r.querySelector(s);
const ic = (id, cls = 'i') => '<svg class="' + cls + '"><use href="#' + id + '"/></svg>';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const nf = new Intl.NumberFormat('ru-RU');
const money = n => Number(n) > 0 ? nf.format(n) + ' TMT' : 'Договорная';
function plural(n, f){ const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; }
function ago(sec){
  const t = sec * 1000, m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return m + ' мин назад';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' ' + plural(h, ['час','часа','часов']) + ' назад';
  const d = new Date(t), y = new Date(); y.setDate(y.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'вчера, ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
}
const catName = id => (CATS.find(c => c.id === id) || CATS[CATS.length - 1]).name;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============ Локальные данные устройства ============ */
const favs = {
  all(){ return store.get('sm_fav_v2', []); },
  has(id){ return this.all().includes(id); },
  toggle(id){ const a = this.all(), i = a.indexOf(id); i >= 0 ? a.splice(i, 1) : a.unshift(id); store.set('sm_fav_v2', a); return i < 0; }
};
const mine = {
  all(){ return store.get('sm_my_v2', {}); },
  ids(){ return Object.keys(this.all()); },
  token(id){ return this.all()[id] || ''; },
  add(id, token){ const a = this.all(); a[id] = token; store.set('sm_my_v2', a); },
  drop(id){ const a = this.all(); delete a[id]; store.set('sm_my_v2', a); }
};
const adminKey = () => store.get('sm_admin', '');

/* ============ API сервера ============ */
async function request(method, url, headers){
  let r;
  try { r = await fetch(url, {method, headers: headers || {}}); }
  catch(e){ throw new Error('Нет связи с сервером'); }
  let data = null; try { data = await r.json(); } catch(e){}
  if (!r.ok) throw new Error((data && data.error) || ('Ошибка сервера (' + r.status + ')'));
  return data;
}
const api = {
  list(p){ const q = new URLSearchParams(); Object.entries(p).forEach(([k, v]) => { if (v !== '' && v != null) q.set(k, v); }); return request('GET', '/api/listings?' + q); },
  get(id){ return request('GET', '/api/listings/' + encodeURIComponent(id)); },
  remove(id, token){ return request('DELETE', '/api/listings/' + encodeURIComponent(id), {'X-Edit-Token': token}); },
  create(fd, onProgress){
    return new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('POST', '/api/listings');
      x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      x.onload = () => { let d = null; try { d = JSON.parse(x.responseText); } catch(e){}
        x.status >= 200 && x.status < 300 ? resolve(d) : reject(new Error((d && d.error) || ('Ошибка сервера (' + x.status + ')'))); };
      x.onerror = () => reject(new Error('Нет связи с сервером'));
      x.send(fd);
    });
  }
};

/* ============ Список ============ */
const state = {page:'home', q:'', cat:'all', city:'', sort:'new', items:[], total:0, req:0};
let lastListHash = '#/';

function renderTopbar(){
  const tb = $('#topbar');
  if (state.page === 'home'){
    tb.innerHTML = '<a class="logo" href="#/"><span class="mark">S</span><span class="txt">System<span>Market</span></span></a>' +
      '<label class="search">' + ic('i-search') + '<input id="q" type="search" enterkeyhint="search" placeholder="Поиск объявлений" value="' + esc(state.q) + '"></label>';
    let t; $('#q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; load(true); }, 350); });
  } else {
    tb.innerHTML = '<h1 class="page-title">' + ({fav:'Избранное', my:'Мои объявления', profile:'Профиль'})[state.page] + '</h1>';
  }
}
function renderCats(){
  const el = $('#cats');
  el.style.display = state.page === 'home' ? 'flex' : 'none';
  el.innerHTML = CATS.map(c => '<button class="chip' + (c.id === state.cat ? ' on' : '') + '" data-cat="' + c.id + '">' + ic('c-' + c.id) + c.name + '</button>').join('');
}
function renderFilters(){
  const el = $('#filters');
  if (state.page !== 'home'){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="filters"><select id="cityF" aria-label="Город"><option value="">Все города</option>' +
    CITIES.map(c => '<option' + (c === state.city ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>' +
    '<select id="sortF" aria-label="Сортировка">' + [['new','Сначала новые'],['cheap','Сначала дешевле'],['exp','Сначала дороже']]
      .map(([v, t]) => '<option value="' + v + '"' + (v === state.sort ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></div>';
  $('#cityF').onchange = e => { state.city = e.target.value; load(true); };
  $('#sortF').onchange = e => { state.sort = e.target.value; load(true); };
}
function photoBox(p, alt){
  return p ? '<img loading="lazy" alt="' + esc(alt) + '" src="' + esc(p.thumb) + '">' : '<span class="nophoto">' + ic('i-camera') + '</span>';
}
function cardHTML(x){
  return '<article class="card">' +
    '<a href="#/item/' + x.id + '" class="ph">' + photoBox(x.photos[0], x.title) +
      (x.photos.length > 1 ? '<span class="badge">' + ic('i-camera') + x.photos.length + '</span>' : '') + '</a>' +
    '<button class="heart' + (favs.has(x.id) ? ' on' : '') + '" data-fav="' + x.id + '" aria-label="В избранное">' + ic('i-heart') + '</button>' +
    '<a href="#/item/' + x.id + '" class="body"><div class="price">' + money(x.price) + '</div>' +
      '<div class="title">' + esc(x.title) + '</div><div class="meta">' + esc(x.city) + ' · ' + ago(x.created) + '</div></a></article>';
}
function skeletons(n){
  return '<div class="grid">' + Array.from({length:n}, () =>
    '<div class="card"><div class="ph sk" style="border-radius:0"></div><div class="body">' +
    '<div class="sk" style="height:18px;width:60%"></div><div class="sk" style="height:14px;width:90%;margin-top:6px"></div><div class="sk" style="height:12px;width:40%;margin-top:8px"></div></div></div>').join('') + '</div>';
}
function emptyHTML(icon, title, text, link, linkText){
  return '<div class="empty"><div class="ic">' + ic(icon) + '</div><b>' + title + '</b><p>' + text + '</p>' +
    (link ? '<a class="btn" href="' + link + '">' + linkText + '</a>' : '') + '</div>';
}
function renderItems(){
  const list = $('#list'), count = $('#count');
  count.textContent = state.page === 'home' ? (state.total ? 'Найдено ' + nf.format(state.total) + ' ' + plural(state.total, ['объявление','объявления','объявлений']) : '') : '';
  if (!state.items.length){
    list.innerHTML = {
      home: state.q || state.cat !== 'all' || state.city
        ? emptyHTML('i-search', 'Ничего не найдено', 'Попробуйте изменить запрос или фильтры')
        : emptyHTML('c-other', 'Объявлений пока нет', 'Станьте первым — подайте объявление', '#/add', 'Подать объявление'),
      fav: emptyHTML('i-heart', 'В избранном пусто', 'Нажимайте на сердечко, чтобы сохранить объявление', '#/', 'Смотреть объявления'),
      my: emptyHTML('i-list', 'У вас нет объявлений', 'Подайте объявление — это займёт пару минут', '#/add', 'Подать объявление')
    }[state.page];
    return;
  }
  list.innerHTML = '<div class="grid">' + state.items.map(cardHTML).join('') + '</div>' +
    (state.items.length < state.total ? '<div class="more"><button class="btn ghost" id="moreBtn">Показать ещё</button></div>' : '');
  const mb = $('#moreBtn'); if (mb) mb.onclick = () => { mb.disabled = true; mb.textContent = 'Загрузка…'; load(false); };
}
async function load(reset){
  const req = ++state.req;
  if (reset){ state.items = []; state.total = 0; $('#list').innerHTML = skeletons(state.page === 'home' ? 8 : 4); $('#count').textContent = ''; }
  const p = {limit: PAGE, offset: reset ? 0 : state.items.length, sort: state.sort};
  if (state.page === 'home'){ Object.assign(p, {q: state.q.trim(), cat: state.cat === 'all' ? '' : state.cat, city: state.city}); }
  else {
    const ids = state.page === 'fav' ? favs.all() : mine.ids();
    if (!ids.length){ state.items = []; state.total = 0; renderItems(); return; }
    p.ids = ids.join(','); p.limit = 60; p.offset = 0;
  }
  try {
    const r = await api.list(p);
    if (req !== state.req) return;
    state.items = reset ? r.items : state.items.concat(r.items);
    state.total = r.total;
    renderItems();
  } catch(e){
    if (req !== state.req) return;
    $('#list').innerHTML = emptyHTML('i-cloud', 'Не удалось загрузить', esc(e.message)) + '<div class="more"><button class="btn ghost" id="retryBtn">Повторить</button></div>';
    $('#retryBtn').onclick = () => load(true);
  }
}
function renderProfile(){
  $('#count').textContent = '';
  $('#list').innerHTML =
    '<div class="box" style="margin-top:12px"><div class="seller"><div class="avatar">' + ic('i-user') + '</div><div class="who"><b>Гость</b><span class="meta">Вход по номеру телефона появится в следующей версии</span></div></div></div>' +
    '<div class="box" style="margin-top:12px"><div class="row"><a class="btn ghost" href="#/my">Мои объявления: ' + mine.ids().length + '</a><a class="btn ghost" href="#/fav">Избранное: ' + favs.all().length + '</a></div>' +
    '<p class="meta" style="margin:12px 0 0">Ваши объявления привязаны к этому браузеру. Если очистить данные браузера, удалить их отсюда будет нельзя.</p></div>' +
    '<div class="box" style="margin-top:12px"><details class="adm"' + (adminKey() ? ' open' : '') + '><summary>Для администратора</summary>' +
    '<div class="field" style="margin-top:10px"><label for="admKey">Ключ администратора</label><input id="admKey" type="password" value="' + esc(adminKey()) + '" autocomplete="off"></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="admSave">Сохранить</button><button class="btn ghost" id="admClear">Выйти</button></div></details></div>';
  $('#admSave').onclick = async () => {
    const k = $('#admKey').value.trim();
    try { const r = await request('GET', '/api/admin/check', {'X-Edit-Token': k});
      if (r.admin){ store.set('sm_admin', k); toast('Режим администратора включён'); } else toast('Неверный ключ');
    } catch(e){ toast(e.message); }
  };
  $('#admClear').onclick = () => { store.set('sm_admin', ''); $('#admKey').value = ''; toast('Режим администратора выключен'); };
}
function renderPage(){
  renderTopbar(); renderCats(); renderFilters();
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === state.page));
  if (state.page === 'profile') renderProfile(); else load(true);
}

/* ============ Объявление ============ */
async function openDetail(id){
  openSheet('detailSheet');
  $('#detailHeadTitle').textContent = 'Объявление';
  $('#detailBody').innerHTML = '<div class="sk" style="aspect-ratio:4/3;border-radius:0"></div><div class="detail"><div class="sk" style="height:30px;width:50%"></div><div class="sk" style="height:20px;width:85%"></div><div class="sk" style="height:120px"></div></div>';
  let x;
  try { x = await api.get(id); }
  catch(e){ $('#detailBody').innerHTML = emptyHTML('i-cloud', 'Не удалось открыть', esc(e.message)); return; }
  if (!$('#detailSheet').classList.contains('open')) return;
  $('#detailHeadTitle').textContent = x.title;
  const favBtn = $('#detailFav');
  favBtn.classList.toggle('on', favs.has(x.id));
  favBtn.onclick = () => { const on = favs.toggle(x.id); favBtn.classList.toggle('on', on); if (state.page === 'fav') needsReload = true; toast(on ? 'Добавлено в избранное' : 'Удалено из избранного'); };
  $('#shareBtn').onclick = async () => {
    const url = location.origin + location.pathname + '#/item/' + x.id;
    if (navigator.share){ try { await navigator.share({title: x.title, text: money(x.price), url}); } catch(e){} }
    else if (navigator.clipboard){ navigator.clipboard.writeText(url).then(() => toast('Ссылка скопирована')); }
    else toast(url);
  };

  const e = x.extra || {};
  let specs = [];
  if (x.cat === 'auto') specs = [['Марка', e.brand], ['Модель', e.model], ['Год выпуска', e.year], ['Пробег', e.mileage != null ? nf.format(e.mileage) + ' км' : ''], ['Коробка', e.gear], ['Топливо', e.fuel]];
  if (x.cat === 'realty') specs = [['Тип сделки', e.deal], ['Комнат', e.rooms], ['Площадь', e.area != null ? e.area + ' м²' : ''], ['Этаж', e.floor]];
  specs = specs.filter(r => r[1] !== '' && r[1] != null);
  const canDelete = mine.token(x.id) || adminKey();
  const ph = x.photos;
  const phone = String(x.phone || '').replace(/[^\d+]/g, '');

  $('#detailBody').innerHTML =
    '<div class="gallery">' + (ph.length
      ? '<div class="track" id="track">' + ph.map((p, i) => '<img alt="' + esc(x.title) + '" src="' + esc(p.url) + '" data-full="' + esc(p.url) + '"' + (i ? ' loading="lazy"' : '') + '>').join('') + '</div>' +
        (ph.length > 1 ? '<div class="counter" id="counter">1 / ' + ph.length + '</div>' : '')
      : '<div class="nophoto">' + ic('i-camera') + '</div>') + '</div>' +
    (ph.length > 1 ? '<div class="thumbs" id="thumbs">' + ph.map((p, i) => '<img alt="" src="' + esc(p.thumb) + '" data-i="' + i + '"' + (i ? '' : ' class="on"') + '>').join('') + '</div>' : '') +
    '<div class="detail">' +
      '<div><div class="price">' + money(x.price) + '</div><h1>' + esc(x.title) + '</h1></div>' +
      '<div class="tags"><span class="tag">' + ic('c-' + x.cat) + catName(x.cat) + '</span><span class="tag">' + ic('i-pin') + esc(x.city) + '</span>' +
        '<span class="tag">' + ic('i-clock') + ago(x.created) + '</span><span class="tag">' + ic('i-eye') + nf.format(x.views) + '</span></div>' +
      (specs.length ? '<div class="box"><h3>Характеристики</h3><dl class="specs">' + specs.map(r => '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>').join('') + '</dl></div>' : '') +
      (x.desc ? '<div class="box"><h3>Описание</h3><p class="desc">' + esc(x.desc) + '</p></div>' : '') +
      '<div class="box"><div class="seller"><div class="avatar">' + esc((x.name || 'П').trim().charAt(0).toUpperCase()) + '</div>' +
        '<div class="who"><b>' + esc(x.name) + '</b><span class="meta">' + esc(x.phone) + '</span></div></div>' +
        '<div class="row" style="margin-top:12px"><a class="btn" href="tel:' + esc(phone) + '">' + ic('i-phone') + 'Позвонить</a><button class="btn ghost" id="copyPhone">' + ic('i-copy') + 'Номер</button></div></div>' +
      (canDelete ? '<button class="btn danger block" id="delBtn">Удалить объявление</button>' : '') +
      '<div class="foot">Объявление № ' + esc(x.id) + '</div>' +
    '</div>';

  const track = $('#track'), counter = $('#counter'), thumbs = $('#thumbs');
  if (track && ph.length > 1) track.addEventListener('scroll', () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (counter) counter.textContent = (i + 1) + ' / ' + ph.length;
    if (thumbs) thumbs.querySelectorAll('img').forEach((t, k) => t.classList.toggle('on', k === i));
  }, {passive:true});
  if (thumbs) thumbs.onclick = ev => { const t = ev.target.closest('[data-i]'); if (t) track.scrollTo({left: track.clientWidth * +t.dataset.i, behavior:'smooth'}); };
  if (track) track.onclick = ev => { const im = ev.target.closest('[data-full]'); if (im){ $('#viewerImg').src = im.dataset.full; $('#viewer').classList.add('open'); } };
  $('#copyPhone').onclick = () => {
    (navigator.clipboard ? navigator.clipboard.writeText(x.phone) : Promise.reject()).then(() => toast('Номер скопирован'), () => toast(x.phone));
  };
  const del = $('#delBtn');
  if (del) del.onclick = async () => {
    if (!confirm('Удалить объявление? Это нельзя отменить.')) return;
    del.disabled = true;
    try { await api.remove(x.id, mine.token(x.id) || adminKey()); mine.drop(x.id); needsReload = true; toast('Объявление удалено'); closeSheet(); }
    catch(err){ del.disabled = false; toast(err.message); }
  };
}

/* ============ Подача объявления ============ */
let draft = [], draftCat = '', sending = false;
function buildForm(){
  $('#catPick').innerHTML = CATS.filter(c => c.id !== 'all').map(c => '<button type="button" data-pick="' + c.id + '">' + ic('c-' + c.id) + c.name + '</button>').join('');
  $('#fCity').innerHTML = CITIES.map(c => '<option>' + c + '</option>').join('');
  $('#fBrand').innerHTML = BRANDS.map(b => '<option>' + b + '</option>').join('');
  $('#catPick').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    draftCat = b.dataset.pick;
    document.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x === b));
    $('#autoFields').classList.toggle('show', draftCat === 'auto');
    $('#realtyFields').classList.toggle('show', draftCat === 'realty');
    $('#errCat').classList.remove('show');
  });
  $('#photoInput').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    const room = MAX_PHOTOS - draft.length;
    if (files.length > room) toast('Можно добавить не больше ' + MAX_PHOTOS + ' фото');
    for (const f of files.slice(0, room)){
      if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name)){ toast('Это не фото: ' + f.name); continue; }
      const blob = await compress(f).catch(() => f);
      draft.push({blob, url: URL.createObjectURL(blob)});
      renderPhotos();
    }
  });
  $('#photoGrid').addEventListener('click', e => {
    const x = e.target.closest('[data-rm]');
    if (x){ const [p] = draft.splice(+x.dataset.rm, 1); URL.revokeObjectURL(p.url); renderPhotos(); }
  });
  $('#addForm').addEventListener('input', e => {
    const err = {fTitle:'errTitle', fPrice:'errPrice', fPhone:'errPhone'}[e.target.id];
    if (err) $('#' + err).classList.remove('show');
  });
  $('#addForm').addEventListener('submit', submitForm);
  const saved = store.get('sm_contact', null);
  if (saved){ $('#fName').value = saved.name || ''; $('#fPhone').value = saved.phone || ''; }
}
function renderPhotos(){
  $('#photoGrid').innerHTML = draft.map((p, i) =>
    '<div class="slot"><img alt="" src="' + p.url + '"><button type="button" class="x" data-rm="' + i + '" aria-label="Убрать фото">' + ic('i-x') + '</button>' +
    (i === 0 ? '<span class="main">Главное</span>' : '') + '</div>').join('') +
    (draft.length < MAX_PHOTOS ? '<label class="addph" for="photoInput">' + ic('i-camera') + (draft.length ? 'Ещё фото' : 'Добавить фото') + '</label>' : '');
}
function compress(file, max = 1600, q = 0.82){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function resetForm(){
  draft.forEach(p => URL.revokeObjectURL(p.url)); draft = []; draftCat = '';
  const keep = {name: $('#fName').value, phone: $('#fPhone').value};
  $('#addForm').reset(); $('#fName').value = keep.name; $('#fPhone').value = keep.phone;
  document.querySelectorAll('[data-pick]').forEach(x => x.classList.remove('on'));
  $('#autoFields').classList.remove('show'); $('#realtyFields').classList.remove('show');
  document.querySelectorAll('.err').forEach(x => x.classList.remove('show'));
  renderPhotos();
}
async function submitForm(e){
  e.preventDefault();
  if (sending) return;
  const v = id => $('#' + id).value.trim();
  let ok = true;
  const need = (cond, errId) => { $('#' + errId).classList.toggle('show', !cond); if (!cond) ok = false; };
  need(!!draftCat, 'errCat');
  need(v('fTitle').length >= 3, 'errTitle');
  need(v('fPrice') !== '' && Number(v('fPrice')) >= 0, 'errPrice');
  need(v('fPhone').replace(/\D/g, '').length >= 6, 'errPhone');
  if (!ok){ toast('Заполните отмеченные поля'); const f = document.querySelector('.err.show'); if (f) f.scrollIntoView({block:'center', behavior:'smooth'}); return; }

  const fd = new FormData();
  fd.append('cat', draftCat);
  ['title','price','city','desc','name','phone'].forEach(n => fd.append(n, v('f' + n[0].toUpperCase() + n.slice(1))));
  const sec = draftCat === 'auto' ? '#autoFields' : draftCat === 'realty' ? '#realtyFields' : null;
  if (sec) document.querySelectorAll(sec + ' [name]').forEach(el => fd.append(el.name, el.value.trim()));
  draft.forEach((p, i) => fd.append('photos', p.blob, 'photo' + (i + 1) + '.jpg'));
  store.set('sm_contact', {name: v('fName'), phone: v('fPhone')});

  sending = true;
  const btn = $('#submitBtn'), bar = $('#upBar'), txt = $('#submitTxt');
  btn.disabled = true; txt.textContent = draft.length ? 'Загрузка фото… 0%' : 'Публикуем…';
  try {
    const r = await api.create(fd, p => { bar.style.width = Math.round(p * 100) + '%'; if (draft.length) txt.textContent = p < 1 ? 'Загрузка фото… ' + Math.round(p * 100) + '%' : 'Обработка…'; });
    mine.add(r.id, r.token);
    needsReload = true;
    toast('Объявление опубликовано');
    resetForm();
    lastListHash = '#/my';
    location.replace('#/item/' + r.id);
  } catch(err){
    toast(err.message);
  } finally {
    sending = false; btn.disabled = false; bar.style.width = '0'; txt.textContent = 'Опубликовать';
  }
}

/* ============ Окна и навигация ============ */
let sheetFromList = false, firstRender = true, needsReload = false;
function openSheet(id){
  document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('open', s.id === id));
  document.body.style.overflow = 'hidden';
  $('#' + id).scrollTop = 0;
}
function hideSheets(){ document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); document.body.style.overflow = ''; }
function closeSheet(){ if (sheetFromList) history.back(); else location.hash = lastListHash; }
function route(){
  const parts = (location.hash || '#/').slice(2).split('/');
  const page = parts[0] || 'home';
  if (firstRender){ firstRender = false; if (page === 'item' || page === 'add'){ state.page = 'home'; renderPage(); } }
  if (page === 'item'){ openDetail(parts[1]); return; }
  if (page === 'add'){ openSheet('formSheet'); return; }
  const wasOpen = !!document.querySelector('.sheet.open');
  const next = ['fav', 'my', 'profile'].includes(page) ? page : 'home';
  const sameList = wasOpen && next === state.page && (location.hash || '#/') === lastListHash;
  hideSheets(); sheetFromList = false;
  state.page = next; lastListHash = location.hash || '#/';
  if (sameList && !needsReload){ // вернулись из объявления — список и прокрутку не трогаем
    document.querySelectorAll('[data-fav]').forEach(b => b.classList.toggle('on', favs.has(b.dataset.fav)));
    return;
  }
  needsReload = false;
  renderPage();
}
window.addEventListener('hashchange', e => {
  const from = e.oldURL.split('#')[1] || '/', to = location.hash.slice(1);
  sheetFromList = !/^\/(item|add)/.test(from) && /^\/(item|add)/.test(to);
  route();
});
document.addEventListener('click', e => {
  const chip = e.target.closest('[data-cat]');
  if (chip){ state.cat = chip.dataset.cat; renderCats(); load(true); chip.scrollIntoView({inline:'nearest', block:'nearest'}); return; }
  const heart = e.target.closest('[data-fav]');
  if (heart){ const on = favs.toggle(heart.dataset.fav); heart.classList.toggle('on', on); toast(on ? 'Добавлено в избранное' : 'Удалено из избранного'); if (state.page === 'fav') load(true); return; }
  if (e.target.closest('[data-close]')) closeSheet();
});
$('#viewer').onclick = () => $('#viewer').classList.remove('open');
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#viewer').classList.contains('open')) $('#viewer').classList.remove('open');
  else if (document.querySelector('.sheet.open')) closeSheet();
});

buildForm(); renderPhotos(); route();
})();
</script>
