LABEL sstym
TEXT HELP
Start Sstym Linux from this USB stick (live session).
ENDTEXT
MENU LABEL ^Start Sstym Linux
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=50% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 %KERNEL_PARAMS%

LABEL sstyminstall
TEXT HELP
Start Sstym Linux and open the installer.
ENDTEXT
MENU LABEL ^Install Sstym Linux
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=50% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 sstym.install=1 %KERNEL_PARAMS%

