LABEL sstym
TEXT HELP
Start Sstym Linux from this USB stick (live session).
ENDTEXT
MENU LABEL ^Start Sstym Linux
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 %KERNEL_PARAMS%

LABEL sstyminstall
TEXT HELP
Start Sstym Linux and open the installer.
ENDTEXT
MENU LABEL ^Install Sstym Linux
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 sstym.install=1 %KERNEL_PARAMS%

LABEL sstymsafe
TEXT HELP
Use this if the screen stays black: basic graphics, no splash.
ENDTEXT
MENU LABEL Start Sstym Linux - safe ^graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf nomodeset plymouth.enable=0 %KERNEL_PARAMS%

LABEL sstymram
TEXT HELP
Copy the whole system to RAM first (faster; you can remove the USB stick).
ENDTEXT
MENU LABEL Start Sstym Linux - copy to ^RAM
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf copytoram quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 %KERNEL_PARAMS%
