-- Sstym Cozy — desktop clock
conky.config = {
    out_to_wayland = true, out_to_x = false,
    alignment = 'top_right', gap_x = 70, gap_y = 90,
    update_interval = 1, double_buffer = true,
    use_xft = true, font = 'Noto Serif:size=14',
    default_color = 'fff4e2', color1 = 'ffc978',
    draw_shades = false, draw_outline = false, draw_borders = false,
    minimum_width = 420,
}
conky.text = [[
${alignr}${font Noto Serif:light:size=88}${time %H:%M}${font}
${alignr}${color1}${font Noto Serif:italic:size=18}${time %A · %d %B}${font}${color}
]]
