<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sstym Linux</title>
<style>
  :root { --bg1:#0a0e18; --bg2:#1e0c2c; --fg:#eef1f8; --dim:#8b93a7; --cyan:#00e5ff; --violet:#7c4dff; --pink:#ff2bd6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: "Noto Sans", "DejaVu Sans", sans-serif; color:var(--fg);
         background: radial-gradient(1200px 600px at 75% 15%, rgba(0,229,255,.18), transparent 60%),
                     radial-gradient(900px 600px at 15% 90%, rgba(255,43,214,.16), transparent 60%),
                     linear-gradient(180deg, var(--bg1), var(--bg2));
         display:flex; flex-direction:column; align-items:center; padding:9vh 16px 40px; }
  img.logo { width:96px; height:96px; filter: drop-shadow(0 0 24px rgba(124,77,255,.6)); }
  h1 { margin:14px 0 2px; letter-spacing:.25em; font-size:28px; }
  .tag { color:var(--cyan); margin-bottom:6px; }
  .clock { color:var(--dim); margin-bottom:28px; font-variant-numeric: tabular-nums; }
  form { width:min(640px,100%); }
  input { width:100%; padding:14px 20px; font-size:17px; color:var(--fg); border-radius:16px;
          border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08); outline:none; }
  input:focus { border-color:var(--cyan); background:rgba(255,255,255,.12); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px,1fr)); gap:14px;
           width:min(760px,100%); margin-top:30px; }
  a.tile { display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:18px;
           text-decoration:none; color:var(--fg); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
           transition: transform .12s ease, background .12s ease; }
  a.tile:hover { transform: translateY(-3px); background:rgba(255,255,255,.12); }
  .ic { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-weight:700; font-size:20px; color:#fff; }
  .foot { margin-top:34px; color:var(--dim); font-size:13px; text-align:center; }
  kbd { background:rgba(255,255,255,.1); padding:2px 6px; border-radius:6px; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="">
  <h1>SSTYM LINUX</h1>
  <div class="tag">hack · learn · build</div>
  <div class="clock" id="clock"></div>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" placeholder="Поиск в интернете…" autofocus autocomplete="off">
  </form>
  <div class="tiles">
    <a class="tile" href="https://claude.ai"><span class="ic" style="background:#d97757">C</span>Claude</a>
    <a class="tile" href="https://www.youtube.com"><span class="ic" style="background:#ff0033">▶</span>YouTube</a>
    <a class="tile" href="https://web.telegram.org"><span class="ic" style="background:#229ed9">T</span>Telegram</a>
    <a class="tile" href="https://chatgpt.com"><span class="ic" style="background:#10a37f">G</span>ChatGPT</a>
    <a class="tile" href="https://github.com"><span class="ic" style="background:#24292f">⌥</span>GitHub</a>
    <a class="tile" href="https://ru.wikipedia.org"><span class="ic" style="background:#555">W</span>Wikipedia</a>
    <a class="tile" href="https://translate.google.com"><span class="ic" style="background:#4285f4">文</span>Translate</a>
    <a class="tile" href="https://mail.google.com"><span class="ic" style="background:#ea4335">@</span>Gmail</a>
  </div>
  <div class="foot">Сайты не открываются? Нажмите <kbd>Super</kbd>+<kbd>N</kbd> — VPN и обход блокировок.</div>
<script>
  const c = document.getElementById('clock');
  const tick = () => c.textContent = new Date().toLocaleString('ru-RU', {weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
