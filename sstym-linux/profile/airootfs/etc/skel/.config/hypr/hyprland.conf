# Sstym Linux — Hyprland configuration (macOS-style desktop)
# Docs: https://wiki.hypr.land/

################
### MONITORS ###
################
monitor = , preferred, auto, 1

###################
### MY PROGRAMS ###
###################
$terminal   = kitty
$fileMgr    = thunar
$browser    = firefox
$menu       = rofi -show drun
$launchpad  = nwg-drawer
$lock       = hyprlock

#################
### AUTOSTART ###
#################
exec-once = /usr/local/bin/sstym-autostart

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1

#####################
### LOOK AND FEEL ###
#####################
# macOS-like: generous gaps, big rounding, frosted-glass blur, soft shadows
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ffffff66) rgba(00e5ff88) 45deg
    col.inactive_border = rgba(ffffff14)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.93
    dim_inactive = true
    dim_strength = 0.06
    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000099)
        color_inactive = rgba(0000004d)
    }
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.20
        vibrancy_darkness = 0.1
        popups = true
    }
}

# Performance: skip rendering fully-occluded windows, no damage tracking waste
cursor {
    no_hardware_cursors = 2   # auto: only when needed (fixes VM cursor lag)
    enable_hyprcursor = true
}

animations {
    enabled = true
    # macOS-like easing
    bezier = macease, 0.22, 1.0, 0.36, 1.0
    bezier = macpop, 0.34, 1.56, 0.64, 1.0
    animation = windows, 1, 5, macpop, popin 70%
    animation = windowsOut, 1, 5, macease, popin 70%
    animation = border, 1, 10, default
    animation = fade, 1, 6, macease
    animation = workspaces, 1, 6, macease, slide
    animation = specialWorkspace, 1, 6, macpop, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    focus_on_activate = true
}

#############
### INPUT ###
#############
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

###################
### KEYBINDINGS ###
###################
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, E, exec, $fileMgr
bind = $mod, B, exec, $browser
bind = $mod, V, togglefloating,
bind = $mod, Space, exec, $menu            # Spotlight
bind = $mod, A, exec, $launchpad           # Launchpad
bind = $mod, R, exec, $menu
bind = $mod, L, exec, $lock
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod SHIFT, I, exec, sstym-install
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim - | wl-copy

# focus (vim + arrows)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r

# workspaces 1-10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrulev2 = suppressevent maximize, class:.*
# frosted-glass look for terminals
windowrulev2 = opacity 0.90 0.84, class:^(kitty)$
windowrulev2 = opacity 0.96 0.90, class:^(thunar)$
windowrulev2 = float, class:^(org.kde.calamares)$
windowrulev2 = float, title:^(Install Sstym Linux)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(org.kde.calamares)$
windowrulev2 = opacity 1.0 1.0, class:^(firefox)$
# the Launchpad / drawer: no shadow, no rounding (full-screen overlay)
layerrule = blur, nwg-drawer
layerrule = blur, nwg-dock
layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar
