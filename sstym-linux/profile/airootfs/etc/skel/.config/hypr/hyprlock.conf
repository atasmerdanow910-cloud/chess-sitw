background {
    monitor =
    path = /usr/share/sstym/wallpaper.png
    blur_passes = 3
    blur_size = 6
    color = rgba(10, 14, 24, 1.0)
}
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(124, 77, 255, 1.0)
    inner_color = rgba(18, 24, 44, 0.9)
    font_color = rgba(230, 236, 255, 1.0)
    placeholder_text = <span foreground="##8b93a7">Sstym Linux — password</span>
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrains Mono ExtraBold
    color = rgba(0, 229, 255, 1.0)
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = JetBrains Mono
    color = rgba(198, 204, 219, 1.0)
    position = 0, 60
    halign = center
    valign = center
}
