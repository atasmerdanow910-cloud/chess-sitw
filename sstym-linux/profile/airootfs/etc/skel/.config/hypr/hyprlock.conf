# Sstym Linux — lock screen (macOS style)
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot          # blurred picture of your desktop, like macOS
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    color = rgba(10, 10, 14, 1.0)
}

# date + big time at the top
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"
    font_size = 22
    font_family = Inter SemiBold
    color = rgba(255, 255, 255, 0.85)
    position = 0, -90
    halign = center
    valign = top
}
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Inter Bold
    color = rgba(255, 255, 255, 0.92)
    position = 0, -130
    halign = center
    valign = top
}

# avatar + user name
image {
    monitor =
    path = /usr/share/sstym/logo.png
    size = 96
    rounding = -1
    border_size = 0
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    font_size = 18
    font_family = Inter SemiBold
    color = rgba(255, 255, 255, 0.95)
    position = 0, -130
    halign = center
    valign = center
}

# password pill
input-field {
    monitor =
    size = 240, 40
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(255, 255, 255, 0.18)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = rgba(0, 229, 255, 0.5)
    fail_color = rgba(255, 91, 110, 0.6)
    dots_size = 0.2
    dots_spacing = 0.35
    placeholder_text = <span foreground="##ffffffaa">Введите пароль</span>
    fail_text = Неверный пароль
    fade_on_empty = false
    position = 0, -185
    halign = center
    valign = center
}
