# https://github.com/calamares/calamares/blob/calamares/src/modules/grubcfg/grubcfg.conf
---

defaults:
    GRUB_TIMEOUT: 3
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "1920x1080,1600x900,1366x768,1280x800,auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_THEME: "/usr/share/grub/themes/sstym/theme.txt"
    GRUB_DISABLE_RECOVERY: true
    GRUB_CMDLINE_LINUX: "lsm=landlock,lockdown,yama,integrity,apparmor,bpf quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0"
    GRUB_ENABLE_CRYPTODISK: true

overwrite: false
prefer_grub_d: false
keepDistributor: false

