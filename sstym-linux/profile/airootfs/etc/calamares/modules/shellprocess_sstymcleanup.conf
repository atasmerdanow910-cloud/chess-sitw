---
# Runs inside the freshly unpacked system, before the initramfs is built.
# Removes everything that only makes sense on the live USB.
dontChroot: false
timeout: 300
verbose: true
i18n:
    name: "Preparing Sstym Linux for this computer"
    name[ru]: "Подготовка Sstym Linux для этого компьютера"
script:
    # live initramfs hooks (archiso) — the installed system uses normal hooks
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    # live-only systemd tweaks: RAM-only journal, no suspend, tmpfs keyring
    - "-rm -f /etc/systemd/journald.conf.d/volatile-storage.conf"
    - "-rm -f /etc/systemd/logind.conf.d/do-not-suspend.conf"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/sstym-live-setup.service"
    - "-rm -f /root/.automated_script.sh /root/.zlogin"
    # a real, persistent pacman keyring
    - "-pacman-key --init"
    - "-pacman-key --populate archlinux blackarch"
    # the login screen starts the Sstym desktop by default
    - "-sh -c 'mkdir -p /var/lib/sddm && printf \"[Last]\\nSession=/usr/share/wayland-sessions/sstym.desktop\\n\" > /var/lib/sddm/state.conf && chown -R sddm:sddm /var/lib/sddm'"
