# https://github.com/calamares/calamares/blob/calamares/src/modules/welcome/welcome.conf
---
showSupportUrl:         https://github.com/atasmerdanow910-cloud/chess-sitw/issues
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    30.0
    requiredRam:        2.0
    internetCheckUrl:
        - https://github.com
        - https://archlinux.org
        - http://example.com

    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - ram

geoip:
    style:    "none"
    url:      "https://geoip.kde.org/v1/ubiquity"  # extended XML format
    selector: "CountryCode"  # blank uses default, which is wrong

