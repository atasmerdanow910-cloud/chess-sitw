#
# Sstym Linux — /etc/pacman.conf
# See the pacman.conf(5) manpage for option and repository directives
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-bit libraries: Steam, Wine, Proton, 32-bit graphics drivers
[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch: 2800+ security tools (Sstym Settings → Security tools)
[blackarch]
Include = /etc/pacman.d/blackarch-mirrorlist
