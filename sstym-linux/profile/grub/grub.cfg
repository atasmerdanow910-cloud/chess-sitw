submenu "Advanced options  ·  Дополнительно" --class advanced --id 'sstym-advanced' {
    menuentry "Safe graphics (black screen? use this)" --class safe {
      linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf nomodeset plymouth.enable=0 %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
    
    menuentry "Copy to RAM (faster, USB can be removed)" --class ram {
        set gfxpayload=keep
      linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lsm=landlock,lockdown,yama,integrity,apparmor,bpf quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 copytoram %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
    
    if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
        menuentry 'Memory test' --class memtest {
            set gfxpayload=800x600,1024x768
            linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
        }
    elif [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
        menuentry 'Memory test' --class memtest {
            set gfxpayload=800x600,1024x768
            linux /boot/memtest86+/memtest
        }
    fi
    if [ "${grub_platform}" == 'efi' ]; then
        menuentry 'Firmware settings (UEFI / BIOS setup)' --class efi --id 'uefi-firmware' {
            fwsetup
        }
    fi
}

menuentry 'Restart' --class restart {
    reboot
}

menuentry 'Shut down' --class shutdown {
    halt
}
