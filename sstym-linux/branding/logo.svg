<?xml version="1.0" encoding="UTF-8"?>
<!-- Sstym Linux logo: a neon "S" inside a hexagon -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a2e"/>
      <stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
  </defs>
  <!-- outer hexagon -->
  <polygon points="256,28 453.5,142 453.5,370 256,484 58.5,370 58.5,142"
           fill="url(#fill)" stroke="url(#neon)" stroke-width="22" stroke-linejoin="round"/>
  <!-- inner thin hexagon -->
  <polygon points="256,66 420.5,161 420.5,351 256,446 91.5,351 91.5,161"
           fill="none" stroke="#7c4dff" stroke-opacity="0.35" stroke-width="4" stroke-linejoin="round"/>
  <!-- the S -->
  <path d="M 321.8 172.1 A 70 70 0 1 0 256 266 A 70 70 0 1 1 190.2 359.9"
        fill="none" stroke="url(#neon)" stroke-width="46" stroke-linecap="round"/>
  <!-- terminal cursor -->
  <rect x="352" y="380" width="34" height="12" rx="3" fill="#00e5ff"/>
</svg>
